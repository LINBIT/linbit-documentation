stages:
  - build
  - preview
  - deploy

variables:
  BUILD_HELPERS_VERSION: 0fa86e05314b906db34862d95e81b598dc029fa1

build:
  stage: build
  image:
    name: $CI_REGISTRY/linbit/linbit-documentation
    entrypoint: [""]
  rules:
    - if: $CI_MERGE_REQUEST_ID
  script:
    - make UG9-html-finalize
  artifacts:
    paths:
      - UG9/en/output-html-finalize/*.zip

lint:
  stage: build
  image:
    name: $LINBIT_DOCKER_REGISTRY/lb-vale:latest
    entrypoint: [""]
  rules:
    - if: $CI_MERGE_REQUEST_ID && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == 'master'
  script:
    - apk add --no-cache git
    - git fetch
    # use `tr` to sanitize variable in case there are multiple `.adoc` files to lint
    - ADOCFILES="$(git diff-tree --no-commit-id --name-only --diff-filter=d -r remotes/origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME} ${CI_COMMIT_SHA} '*.adoc' | tr '\n' ' ')"
    - |
      if [ -z "$ADOCFILES" ]; then
        echo "No .adoc files in this MR"
        echo -e '[\n  {\n    "description": "Merge request has no .adoc files",\n    "check_name": "ADOCFILES-variable-is-empty",\n    "fingerprint": "0a0a0a0a0a0a0a0a0a0a0a0a0a0a0a0a",\n    "severity": "info",\n    "location": {\n      "path": "na",\n      "lines": {\n        "begin": 0\n      }\n    }\n  }\n]' > vale.json
        cp vale.json vale-climate.json
      else
        /bin/vale $ADOCFILES --config=/vale_app/.vale.ini --no-exit --output=JSON | tee vale.json
        /bin/vale2climate vale.json >> vale-climate.json
      fi
  artifacts:
    paths:
      - vale.json
    when: always
    reports:
      codequality:
        - vale-climate.json

render-preview:
  stage: preview
  image: $LINBIT_DOCKER_REGISTRY/ug-preview:latest
  rules:
    - if: $CI_MERGE_REQUEST_ID
  needs:
    - build
  script:
    - mkdir preview
    - |
      for zip in "$CI_PROJECT_DIR"/UG9/en/output-html-finalize/*.zip; do
        prefix=$(basename "$zip" .zip)
        (cd /build && php linbit-drbd.php "$zip" "$CI_PROJECT_DIR/preview/$prefix")
        echo "<a href='./$prefix/index.html'><h2>$prefix</h2></a>" >> preview/index.html
      done
  artifacts:
    paths:
      - preview/

preview:
  stage: preview
  image: $LINBIT_DOCKER_REGISTRY/build-helpers:$BUILD_HELPERS_VERSION
  rules:
    - if: $CI_MERGE_REQUEST_ID
  needs:
    - render-preview
  environment:
    name: preview/$CI_COMMIT_REF_SLUG
    url: $LINBIT_PULP_BASE_URL/pulp/content/file/pages/linbit-documentation/$CI_COMMIT_REF_SLUG/index.html
  script:
    - . gitlab-utils.sh
    - ci_prepare_tools
    # Fetch and cache the Pulp API schema once before uploading in parallel.
    - pulp status > /dev/null
    - |
      set -o pipefail
      cd preview
      find . -type f -printf '%P\n' \
        | parallel --halt now,fail=1 --jobs 8 \
            pulp file content upload --file {} --relative-path "linbit-documentation/$CI_COMMIT_REF_SLUG/{}" \
        | jq --slurp 'map({sha256, relative_path})' > "$CI_PROJECT_DIR/preview-content.json"
      pulp file repository content modify --repository pages --add-content "@$CI_PROJECT_DIR/preview-content.json"

deploy:
  stage: deploy
  image:
    name: $CI_REGISTRY/linbit/linbit-documentation
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_BRANCH == 'master'
  before_script:
    - echo "DEPLOY"
  script:
    - mkdir -p ~/src && cp -r . ~/src && cd ~/src
    - cp /linbit-documentation/GNUmakefile .
    - cp -r /fonts .
    - cp -r /themes .
    - ln -s /fonts ./linbit-fonts
    - make trusthosts all-clean DOCKER=no SFTPUSER=$SFTPUSERSTAGING STAGING=yes
    - make trusthosts all DOCKER=no SFTPUSER=$SFTPUSER SKIPGENERATE=yes
    - make g-upload-ug-pdfs
